# =============================================================================
# Extraction pipeline configuration.
#
# Model configuration is DATA, not code. Every field under `provider`,
# `providers.*`, and `thinking_level` is stamped into every output record so a
# transcript is always traceable to exactly how it was produced.
# =============================================================================

# Which provider block below is active. One of: openrouter | gemini | vertex
provider: gemini

# Stamped into every record. Passed through to the provider that supports it.
thinking_level: medium

providers:
  # AI Studio / Gemini Developer API. Serves Gemma (gemma-4-31b-it) and Gemini.
  gemini:
    model_id: "gemma-4-31b-it"
    api_base: null
    api_key_env: "AI_STUDIO_API_KEY"
    project: null
    location: null

  openrouter:
    model_id: "google/gemma-4-31b-it"
    api_base: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"     # read from environment, never stored here
    project: null
    location: null

  vertex:
    # Vertex AI express mode: authenticate with a Vertex AI API key (NOT an AI
    # Studio key, and NOT ADC). project/location are unused in this mode.
    model_id: "gemma-4-31b-it"
    api_base: null
    api_key_env: "VERTEX_API_KEY"
    project: null
    location: null

# -----------------------------------------------------------------------------
# PDF -> image conversion (Stage 1)
# 300 DPI is deliberate: student blue/black ink and examiner red must stay
# separable, and thin strikethroughs vanish at lower resolution.
# -----------------------------------------------------------------------------
pdf:
  dpi: 300
  image_format: png

# -----------------------------------------------------------------------------
# LLM call behaviour (Stages 2-3)
# -----------------------------------------------------------------------------
llm:
  max_retries: 5          # tenacity attempts on 429 / 5xx
  concurrency: 3          # parallel scripts in flight; keep inside rate limits
  request_timeout_s: 300
  max_output_tokens: 32768  # handwritten transcripts are long; stamped into records
  max_pages_per_call: 0     # 0 = send all pages in one call; >0 triggers chunking
  chunk_overlap_pages: 2    # page overlap when a script must be chunked

# -----------------------------------------------------------------------------
# Cost accounting (USD per 1,000,000 tokens). Stamped/aggregated per record.
# Update to match the active provider's real rates.
# -----------------------------------------------------------------------------
cost:
  input_per_million: 0.10
  output_per_million: 0.30

# Downstream grading targets. We TRANSCRIBE every answer found; these six are
# the ones grading will consume. Listed here so validation can flag missing ones
# without hard-coding them in code.
target_questions: [3, 7, 8, 9, 10, 11]

# -----------------------------------------------------------------------------
# Paths (relative to the project root / this config file's directory)
# -----------------------------------------------------------------------------
paths:
  raw_pdfs: data/raw_pdfs
  images: data/images
  transcripts: data/transcripts
  cache: data/cache
  logs: logs
  prompt_file: prompts/extraction_prompt_v2.md

# =============================================================================
# EVALUATION STAGE — two graders score each extracted answer independently.
# Both graders read the identical rubric + identical per-row prompt; the ONLY
# difference between an A record and a B record is the model. No temperature /
# top_p / top_k is ever sent (removed from Gemini 3.x; kept off both to keep the
# parameter surface identical). thinking_level is identical for both and stamped
# into every record.
# =============================================================================
evaluation:
  thinking_level: high       # identical for both graders; stamped into every record.
                             # Functionally only Grader A (gemini-3.7-flash) uses it
                             # (accepts low|medium|high); gemma has no thinking. Switch
                             # to medium to cut Grader A cost/latency.
  k: 3                       # runs per model per answer — separates model-vs-model
                             # disagreement from within-model sampling noise
  concurrency: 3
  max_retries: 5
  request_timeout_s: 300
  max_output_tokens: 32768

  # Stage 1.5: below this source length the Summary 1/3-length cap is NOT applied
  # (the rule is meant for prose passages, not a 69-word poem). 0 = literal rubric.
  summary_length_cap_exempt_below_words: 100

  graders:
    gemini:                          # Grader A
      model_id: "gemini-3.7-flash"
      provider: vertex               # Vertex AI
      api_key_env: "VERTEX_API_KEY"
    gemma:                           # Grader B
      model_id: "gemma-4-31b-it"
      provider: ai_studio            # Google AI Studio / Gemini Developer API
      api_key_env: "AI_STUDIO_API_KEY"

  # USD per 1,000,000 tokens, keyed by grader. VERIFY against current pricing.
  cost:
    gemini:
      input_per_million: 0.30
      output_per_million: 2.50
    gemma:
      input_per_million: 0.10
      output_per_million: 0.30

  paths:
    extraction_csv: data/extraction.csv
    rubric_file: prompts/rubric_v2.txt
    user_template: prompts/eval_user_template.md
    evaluations: output/evaluations
    evaluation_csv: output/evaluation.csv
    evaluation_runs_csv: output/evaluation_runs.csv
    logs: logs
