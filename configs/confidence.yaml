# Confidence Aggregation, Calibration, and Routing Threshold Configuration

confidence:
  # Aggregation method for segment/token confidences:
  # Options: 'mean', 'minimum', 'length_weighted_mean', 'geometric_mean'
  aggregation_method: "length_weighted_mean"
  
  # Fallback estimator when raw token probabilities are absent
  derive_if_missing: true
  
  # Calibration settings:
  # Options: 'none', 'platt_scaling', 'isotonic_regression'
  calibration_method: "none"
  calibrator_save_path: "outputs/confidence/calibrator.joblib"

evaluation:
  # Binary OCR Acceptability Criterion
  # Used to separate ground-truth acceptable vs unacceptable OCR
  acceptable_ocr:
    max_cer: 0.05
    max_wer: 0.15

  # Candidate thresholds evaluated for downstream Gemma routing
  candidate_thresholds:
    - 0.50
    - 0.55
    - 0.60
    - 0.65
    - 0.70
    - 0.75
    - 0.80
    - 0.85
    - 0.90
    - 0.95

  # Bins for reliability and calibration analysis
  confidence_bins: 10
