# OCR Engine & Hardware Configuration for Handwritten English Exam Evaluation

ocr:
  # BACKEND OPTIONS:
  # - 'trocr' (Handwriting Vision Transformer: microsoft/trocr-base-handwritten - Default)
  # - 'infinite_ocr' / 'nanonets' (Vision-Language model: nanonets/Nanonets-OCR2-3B or Qwen2.5-VL)
  # - 'unlimited_ocr' / 'baidu' (Baidu Unlimited-OCR 3B MoE)
  # - 'easyocr' (CRAFT + BiLSTM baseline)
  # - 'mock' (Deterministic testing backend)
  backend: "trocr"
  
  # MODEL CHECKPOINTS:
  # - "microsoft/trocr-base-handwritten"
  # - "baidu/Unlimited-OCR"
  # - "nanonets/Nanonets-OCR2-3B"
  # - "Qwen/Qwen2.5-VL-3B-Instruct"
  model_name: "microsoft/trocr-base-handwritten"
  
  # Device & execution settings
  # 'auto' automatically selects CUDA GPU if available, else CPU
  device: "auto"
  batch_size: 1
  max_new_tokens: 4096
  temperature: 0.0
  torch_dtype: "auto"

  # Target language (English only for Stage 1)
  language: "en"

paths:
  samples_dir: "data/samples"
  output_dir: "outputs/ocr"
  benchmark_results_dir: "outputs/reports"
