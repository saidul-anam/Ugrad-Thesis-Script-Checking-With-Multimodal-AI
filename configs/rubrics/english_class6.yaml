subject: "English"
class_level: "Class_6"
curriculum: "NCTB"
paper: "English 1st Paper"
total_marks: 90

provenance_and_traceability:
  data_direct:
    - Holistic communicative competence grading appropriate for 6th standard (Class VI)
    - Zero presentation or handwriting bias
    - Content relevance and age-appropriate vocabulary weighting
    - Narrative story development and dialogue mechanics
  syllabus_extrapolated:
    - Summary brevity (about 1/3 of source text) without punitive verbatim caps for junior learners
    - Story title, logical continuity, and simple moral conclusion
    - Dialogue greeting, exchange of ideas, and farewell

question_map:
  - question_no: "1"
    printed_task: "Choose the best answer from the alternatives"
    task_type: MCQ
    mode: A
    standard_marks: 7
    breakdown: "1 x 7 = 7"
  - question_no: "2"
    printed_task: "Write short answers to the following questions"
    task_type: Short_Answer
    mode: B
    standard_marks: 5
    breakdown: "1 x 5 = 5"
  - question_no: "3"
    printed_task: "Complete the passage with suitable words"
    task_type: Cloze_Without_Clues
    mode: A
    standard_marks: 5
    breakdown: "1 x 5 = 5"
  - question_no: "4"
    printed_task: "Read the passage carefully and replace words with suitable synonyms or antonyms"
    task_type: Vocabulary
    mode: A
    standard_marks: 5
    breakdown: "1 x 5 = 5"
  - question_no: "5"
    printed_task: "Complete the table with information from the passage"
    task_type: Table_Completion
    mode: A
    standard_marks: 5
    breakdown: "1 x 5 = 5"
  - question_no: "6"
    printed_task: "Write True if correct and False if incorrect. If False, write correct answer"
    task_type: True_False
    mode: A
    standard_marks: 5
    breakdown: "1 x 5 = 5"
  - question_no: "7"
    printed_task: "Write a summary of the passage in your own words"
    task_type: Summary
    mode: C
    standard_marks: 5
    breakdown: "5"
  - question_no: "8"
    printed_task: "Use prepositions in sentences of your own"
    task_type: Sentence_Making
    mode: B
    standard_marks: 5
    breakdown: "1 x 5 = 5"
  - question_no: "9"
    printed_task: "Put the parts of the story in correct order to make the whole story"
    task_type: Rearrangement
    mode: A
    standard_marks: 8
    breakdown: "1 x 8 = 8"
  - question_no: "10"
    printed_task: "Answer any five of the questions from poems"
    task_type: Short_Answer
    mode: B
    standard_marks: 10
    breakdown: "2 x 5 = 10"
  - question_no: "11"
    printed_task: "Read the opening of a story and complete it in at least ten new sentences with a title"
    task_type: Story
    mode: C
    standard_marks: 10
    breakdown: "10"
  - question_no: "12"
    printed_task: "Write a paragraph in 120 words"
    task_type: Paragraph
    mode: C
    standard_marks: 10
    breakdown: "10"
  - question_no: "13"
    printed_task: "Write a dialogue between you and the doctor"
    task_type: Dialogue
    mode: C
    standard_marks: 10
    breakdown: "10"

paper_structure:
  part_a_reading:
    range: "Q1-Q10"
    marks: 60
  part_b_writing:
    range: "Q11-Q13"
    marks: 30
  total_marks: 90

scoring_modes:
  A_ITEM:
    method: "right/wrong per item against official answer key"
    questions: ["1", "3", "4", "5", "6", "9"]
    task_types: ["MCQ", "Cloze_Without_Clues", "Vocabulary", "Table_Completion", "True_False", "Rearrangement"]
  B_POINT:
    method: "point-scored discrete scale per question part"
    questions: ["2", "8", "10"]
    task_types: ["Short_Answer", "Sentence_Making", "Poetry_Questions"]
  C_BAND:
    method: "band-scored continuous composition with criteria ceilings and performance bands"
    questions: ["7", "11", "12", "13"]
    task_types: ["Summary", "Story", "Paragraph", "Dialogue"]

mode_specifications:
  mode_a_item_scored:
    tasks:
      Q1_MCQ:
        task_type: MCQ
        max_mark: 7
        mark_per_item: 1.0
        n_items: 7
        rules:
          - "Award 1.0 mark per correct option matching letter or text."
      Q3_Cloze_Without_Clues:
        task_type: Cloze_Without_Clues
        max_mark: 5
        mark_per_item: 1.0
        n_items: 5
        rules:
          - "Award 1.0 mark per correct contextually and grammatically appropriate word."
      Q4_Vocabulary:
        task_type: Vocabulary
        max_mark: 5
        mark_per_item: 1.0
        n_items: 5
        rules:
          - "Award 1.0 mark per correct synonym or antonym as specified."
      Q5_Table_Completion:
        task_type: Table_Completion
        max_mark: 5
        mark_per_item: 1.0
        n_items: 5
        rules:
          - "Award 1.0 mark per correct factual extraction from passage into table slot."
      Q6_True_False:
        task_type: True_False
        max_mark: 5
        mark_per_item: 1.0
        n_items: 5
        rules:
          - "Award 1.0 mark per correct True/False classification with correct correction for False."
      Q9_Rearrangement:
        task_type: Rearrangement
        max_mark: 8
        mark_per_item: 1.0
        n_items: 8
        rules:
          - "Positional scoring: Award 1.0 mark for each element correctly placed in sequence."

  mode_b_point_scored:
    tasks:
      Q2_Short_Answer:
        task_type: Short_Answer
        max_mark: 5
        n_items: 5
        mark_per_item: 1.0
        scale:
          1.0: "Accurate, complete response addressing the question directly with clear meaning."
          0.5: "Partially correct response or direct factual lift with minor omissions."
          0.0: "Incorrect, irrelevant, or unattempted."
      Q8_Sentence_Making:
        task_type: Sentence_Making
        max_mark: 5
        n_items: 5
        mark_per_item: 1.0
        scale:
          1.0: "Grammatically meaningful sentence correctly using the given preposition in context."
          0.5: "Sentence uses preposition correctly in context but has minor grammatical or phrasing slips."
          0.0: "Preposition omitted, incorrect usage, meaningless, or unattempted."
        rules:
          - "Award 1.0 mark per grammatically meaningful sentence correctly using the given preposition."
          - "Award 0.5 mark if the preposition is used correctly in context but with minor syntax or spelling errors."
          - "Award 0.0 mark if the preposition is missing, completely misunderstood, or unattempted."
      Q10_Poetry_Questions:
        task_type: Short_Answer
        max_mark: 10
        n_items: 5
        mark_per_item: 2.0
        scale:
          2.0: "Clear poetic comprehension and accurate thematic understanding in simple English."
          1.5: "Accurate understanding with minor grammatical or phrasing slips."
          1.0: "Partial understanding of poem or stanza."
          0.0: "Incorrect, irrelevant, or unattempted."

  mode_c_band_scored:
    hard_caps:
      short_length_below_50_words:
        threshold_words: 40
        max_awarded: 3.0
        applies_to: ["Story", "Paragraph", "Dialogue"]
      off_topic:
        max_awarded: 2.0
        applies_to: ["Summary", "Story", "Paragraph", "Dialogue"]
    performance_bands_by_max_mark:
      5:
        band_1_excellent: "4.0 - 5.0 | Concise, original summary capturing main points accurately with simple, correct sentences."
        band_2_good: "3.0 - 3.5 | Captures main ideas, minimal verbatim copying, minor mechanical slips."
        band_3_satisfactory: "2.0 - 2.5 | Basic summary, noticeable verbatim copying from text, simple syntax."
        band_4_limited: "1.0 - 1.5 | Heavy copying, omits main points, significant grammatical errors."
        band_5_poor: "0.0 - 0.5 | Incoherent, single sentence copy, or unattempted."
      10:
        band_1_excellent: "8.0 - 10.0 | Engaging story/paragraph/dialogue, good basic vocabulary, cohesive ideas, mostly correct simple/compound sentences."
        band_2_good: "6.0 - 7.5 | Clear progression of ideas, understandable narrative/dialogue, minor spelling or grammar errors."
        band_3_satisfactory: "4.0 - 5.5 | Simple linear narrative or basic exchange, predictable ideas, noticeable spelling/tense errors."
        band_4_limited: "2.0 - 3.5 | Underdeveloped, disjointed sentences, frequent grammatical errors obscuring meaning."
        band_5_poor: "0.0 - 1.5 | Disjointed phrases, pervasive errors, off-topic, or unattempted."
    tasks:
      Q7_Summary:
        max_mark: 5
        criteria_ceilings:
          context_content_data: 2.0
          organization_cohesion: 1.5
          language_mechanics: 1.5
      Q11_Story:
        max_mark: 10
        criteria_ceilings:
          context_content_data: 3.5
          organization_cohesion: 2.5
          language_mechanics: 2.5
          originality_comparisons_paraphrase: 1.5
      Q12_Paragraph:
        max_mark: 10
        criteria_ceilings:
          context_content_data: 3.5
          organization_cohesion: 2.5
          language_mechanics: 2.5
          originality_comparisons_paraphrase: 1.5
      Q13_Dialogue:
        max_mark: 10
        criteria_ceilings:
          context_content_data: 3.5
          organization_cohesion: 2.5
          language_mechanics: 2.5
          originality_comparisons_paraphrase: 1.5

general_evaluation_guidelines:
  - grade_expectation: "Class 6 (CEFR A1 to A2): age-appropriate leniency for 11-12 year olds. Prioritize communicative intent over minor agreement slips."   # docs/NCTB_Standard_Evaluation_Rubric_Guide.md section 5
  - zero_presentation_bias: "Ignore penmanship, handwriting style, or minor scratch-outs."
  - feature_based_elaboration: "Do NOT score additively based on raw word count. Grade narrative depth, basic conflict, and communicative development rather than sheer length. An answer can only reach Band 1 or 2 if it contains genuine development."
  - age_appropriate_leniency: "Class 6 students are 11-12 years old. Evaluate communicative intent generously. Do not deduct heavily for minor subject-verb or spelling slips if meaning is clear."
  - mark_granularity: "Whole and half marks (0.5) only."
  - illegibility_handling: "Do not penalise transcription markers ([illegible], [unclear: word]). Mark item unscorable only if completely unreadable."
  - unattempted_vs_wrong: "Unattempted = not_attempted (0 marks). Attempted & wrong = incorrect (0 marks)."
  - no_structural_layout_penalty: "Do not penalise physical paragraph splits, indentations, line breaks, or structural formatting that may be artifacts of OCR extraction."

# Hand-set calibration gates from docs/NCTB_Standard_Evaluation_Rubric_Guide.md section 4 (error-density gating,
# narrative-elaboration baseline, verbatim-overlap summary cap). They were set from single scripts against teacher
# marks, so they are OFF by default and apply only when pipeline.stage4_calibration_gates is true (ablation;
# scripts/evaluate_scripts.py --calibration-gates). When on, the caps join mode_c_band_scored.hard_caps and the
# guidelines join general_evaluation_guidelines.
calibration_gates:
  hard_caps:
    heavy_verbatim_copying:
      threshold_ratio: 0.70
      max_awarded: 2.5
      applies_to: ["Summary"]
  general_evaluation_guidelines:
    - error_density_gating: "In Mode C, evaluate linguistic errors holistically. However, frequent basic errors gate language_mechanics at or below 50% of its ceiling, preventing high Band 1 or Band 2 scores."
