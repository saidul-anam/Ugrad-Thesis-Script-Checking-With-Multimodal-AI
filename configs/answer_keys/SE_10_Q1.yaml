  "2":
    task_type: Comprehension_Questions
    max_mark: 10
    mark_per_item: 2.0
    items:
      - label: a
        question: "What kind of society did Zahir Raihan dream for? What did he do to achieve it?"
        key_points:
          - "Dreamt of a democratic society that would ensure freedom of speech"
          - "Participated in the Language Movement (1952), mass movement (1969), and Liberation War (1971)"
          - "Used filmmaking and documentaries to protest autocratic rule and build world sentiment"
      - label: b
        question: "How does 'Jibon Theke Neya' represent Pakistani autocracy?"
        key_points:
          - "The family portrayed symbolically represented East Pakistan"
          - "Ruled by an autocrat who went to prison for her conspiracy"
          - "Served as a direct allegorical protest against Pakistani dictatorship"
      - label: c
        question: "'Zahir Raihan's dream came true' - how? Describe in 2/3 sentences."
        key_points:
          - "Bangladesh achieved independence and freedom after the 1971 Liberation War"
          - "Democratic society and freedom of speech were established"
          - "Tragically he disappeared on 30 December 1971 and could not live to witness it"
      - label: d
        question: "Do you think Zahir Raihan to be a freedom fighter? Why/ Why not?"
        key_points:
          - "Yes, he actively joined the Liberation War in 1971"
          - "Donated all film proceeds to the Freedom Fighters' Trust"
          - "Made the documentary Stop Genocide to create global support for the war"
      - label: e
        question: "Why is Zahir Raihan regarded as a golden son of Bangladesh?"
        key_points:
          - "One of the most talented filmmakers and patriotic cultural figures"
          - "Sacrificed his career, resources, and eventually his life for the nation"
          - "Dedicated his entire creative work to national emancipation and democracy"
