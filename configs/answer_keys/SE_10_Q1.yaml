passages:
  - questions: ["1", "2", "3"]
    text: |
      Zahir Raihan was one of the most talented film makers in Bangladesh. He was born on 19 August 1935 in the village Majupur in Feni district. He was an active worker of the Language Movement. He was one of the ten students to go out in a procession on 21 February 1952 despite a ban on such activities imposed by the authorities. As a result, he and many others were arrested and taken to prison. Zahir Raihan was also present at the historical meeting of Amtala on 21 February 1952. He also took part in the mass movement in 1969. In 1971, he joined the Liberation War.
      All through his life, Zahir Raihan dreamt of a democratic society, a society that would ensure freedom of speech. He had many dreams about our film industry too. He made a legendary film Jibon Theke Neya based on the Language Movement of 1952. It was a protest against the autocratic government then ruling our country. The family portrayed in that film symbolically represented East Pakistan. The family was ruled by an autocrat who had to go to prison for her conspiracy. During the Liberation War in 1971, this film was shown outside Bangladesh. Celebrated film makers like Satyajit Ray, Mrinal Sen, and Ritwik Ghatak appreciated the film. Raihan gave all the money the film made to the Freedom Fighters' trust. Besides, his great documentary on Pakistani atrocities, Stop Genocide, helped create world sentiment in favour of our liberation war.
      On 30 December 1971, someone informed Raihan about an address somewhere at Mirpur where he might find his brother, the famous writer Shahidullah Kaiser, who had gone missing from 14 December 1971. Kaiser was captured and killed by the Pakistani army and the local collaborators during the last days of the war. Accordingly Raihan left home to get his brother back and he never returned. Zahir Raihan's dream was fulfilled. But it's a pity that this dreamer could not live to see his dream come true.
