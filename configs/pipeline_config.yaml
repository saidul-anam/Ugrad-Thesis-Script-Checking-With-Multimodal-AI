# Configuration for Gemma 4 31B IT Multimodal Script Checking Pipeline

model:
  # Explicitly target Gemma 4 31B IT
  model_id: "google/gemma-4-31b-it"
  # Precision for model weights: bfloat16 (supported on RTX 5090 Blackwell architecture)
  torch_dtype: "bfloat16"
  # Quantization mode: "4bit" (recommended for 32GB VRAM ~18GB footprint), "8bit", or "none"
  quantization: "4bit"
  # Operational context window ceiling (16k native tokens)
  context_window: 16384
  # Automatic GPU device map allocation
  device_map: "auto"
  trust_remote_code: true
  use_flash_attention_2: false  # enable if flash-attn is installed on target machine
  attn_implementation: "sdpa"   # "sdpa" (native PyTorch fused kernel), "flash_attention_2", or "eager"

decoding:
  # Exact verbatim settings specified in gemma_setup.txt
  temperature: 0.0          # Greedy decoding (0.0 removes sampling randomness)
  top_p: 0.1                # Top_p filter (relevant if temperature > 0)
  max_new_tokens: 4096      # Maximum response length per stage
  do_sample: false          # Deterministic generation
  
  # Ablation flag: fallback global reasoning mode toggle
  thinking_mode: false

pipeline:
  # Active stages (can toggle off specific stages for debugging)
  stage0b_teacher_marks: true  # Toggle Stage 0b red-ink teacher mark extraction on/off
  stage1_verbatim: true
  stage2_verification: true
  # Skip Stage 2 on pages where the CPU pre-analysis finds nothing to check (no strike marks, no [struck]/[unclear]
  # tags, no OCR glitches or split tokens, fewer than 2 out-of-vocabulary words). Handwritten pages almost always
  # have one of these: all 555 class-10 pages ran Stage 2, so in practice this skips nothing.
  stage2_conditional: true
  stage3_error_extraction: true
  stage4_rubric_evaluation: true
  # Stage 2b: re-read each text line as a crop; where page and crop readings disagree on whether words
  # are crossed out, ask the VLM (both option orders) and adopt the crop reading only if both agree.
  line_reconciliation: true
  # Ablation only: text-pattern rewriters (Stage 2.5 strike grounding, stutter->strike regexes,
  # lexicon pen-lift stitching). They raised CER on the dev set; see docs/EXTRACTION_FIXES_2026-10-06.md
  legacy_text_rules: false
  # Ablation only: let the model place question boundaries on top of the deterministic segmenter.
  # Off: re-segmenting the same transcript always gives the same answers (src/pipeline/answer_segmenter.py)
  segmentation_llm_recovery: false
  # List the question paper's words in the Stage 1/2 prompts as a reading aid (ablation: false)
  prompt_question_vocab: true
  # Ablation: drop the Stage 2 reply fields no decision reads (confidence, verification_notes)
  stage2_compact_output: false

  # Granular Stage-Level Thinking Mode Routing
  stage1_thinking_mode: false  # STRICTLY False: guarantees 100% pure verbatim student text without preamble
  stage2_thinking_mode: false  # False: structured reasoning handled via 'reason' JSON field
  stage3b_thinking_mode: true  # TRUE: allows deep deliberation on allograph vs genuine error
  stage4_thinking_mode: false  # Stage 4 rubric judgement thinking mode; false matches how the stored evaluations were produced (ablation: --thinking)

  # Separate cap for stage 4: 2048 tokens gives thinking models enough budget for reasoning + full JSON
  stage4_max_new_tokens: 2048
  # Hard cutoff so generation cannot appear stuck indefinitely
  stage4_generation_timeout_sec: 180

  # RAG context configuration
  rag:
    enabled: true
    thematic_context_dir: "configs/context/"

  # Checkpointing / Caching of intermediate stage outputs
  cache_intermediate_stages: true
  output_dir: "outputs/extracted"

# ---------------------------------------------------------------------------
# Stage 3b: Evidence-Fused Handwriting Ambiguity Gate
# Decides whether a Stage 3 "spelling/grammar" candidate is a genuine student error or a
# perceptual misread of this writer's letter shapes. No hand-written letter rules: the
# writer's confusions are learned from their own script, and the fusion weights below are
# PROVISIONAL DEFAULTS meant to be overwritten by the values printed by
#   python scripts/evaluate_arbitration.py --labels data/labels/arbitration_labels.csv --fit
# ---------------------------------------------------------------------------
arbitration:
  mode: "evidence"                 # evidence | legacy (old single whole-page call, for ablation) | off
  max_token_edits: 2               # read/intended token pairs within this many char edits are gated (any error_type)
  use_bbox_localization: true      # ask Gemma for the line bbox first; projection-profile fallback if it fails validation
  localization_min_ratio: 0.6      # fuzzy match between crop re-read and context required to trust a crop
  projection_search_window: 3      # lines either side of the expected line position to try in fallback
  crop_pad_px: 14
  crop_min_height_px: 96
  consensus_samples: 1             # reduced from 5 to 1 (bloat fix: eliminates 4 redundant re-reads per candidate)
  consensus_use_sampling_variant: false
  consensus_temperature: 0.0
  writer_profile_min_count: 2      # a confusion pair must be seen this often in the script before it counts
  threshold_ambiguity: 0.65        # ambiguity_score >= this  -> HANDWRITING_AMBIGUITY (benefit of the doubt)
  threshold_genuine: 0.35          # ambiguity_score <= this  -> GENUINE_ERROR ; in between -> UNCERTAIN (human review)
  save_crops: true
  lexicon_scan: false              # disabled (bloat fix: only gate errors flagged by Stage 3, prevents candidate flooding)
  weights:                         # provisional; replace with fitted values (see above)
    bias: -0.3
    phonetic: 0.6
    writer: 1.2
    consensus: 2.0
    forced_choice: 2.4
