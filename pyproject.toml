[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-multimodal-script-eval"
version = "0.1.0"
description = "4-Stage Multimodal Handwritten Exam Script Evaluation Pipeline using Gemma 4 31B IT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "transformers>=4.48.0",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "gdown>=5.1.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pandas>=2.0.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
